<div class="bg-gray-800 rounded-lg p-4">
    <label class="block text-sm font-medium mb-3">{{label()}}</label>
    <div class="flex items-center gap-3">
        <input type="color" [value]="displayColor()" (input)="updateColor(($event.target).value)"
            class="w-12 h-12 rounded cursor-pointer bg-transparent" />
        <span class="text-sm text-gray-400 font-mono">
            {{ displayColor() }}
        </span>
    </div>
</div>
