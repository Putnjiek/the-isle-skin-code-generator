<router-outlet />

<button type="button" (click)="toggleTheme()" [attr.aria-pressed]="theme() === 'light'"
    [attr.aria-label]="'Switch to ' + (theme() === 'dark' ? 'light' : 'dark') + ' mode'"
    class="fixed top-4 right-6 z-50 cursor-pointer rounded-full p-1 focus-visible:outline focus-visible:outline-offset-4 focus-visible:outline-purple-500">
    <img [src]="theme() === 'dark' ? 'sun.svg' : 'moon.svg'" alt="" aria-hidden="true" class="size-6" />
</button>

<footer class="fixed bottom-4 right-6 flex items-center gap-3 text-sm text-gray-500">
    <a href="https://github.com/Putnjiek/the-isle-skin-code-generator/issues/" target="_blank" rel="noopener noreferrer"
        class="hover:text-purple-400 transition-colors">
        Found a problem?
    </a>

    <span class="text-gray-700">|</span>

    <span>
        Made by
        <a href="https://github.com/Putnjiek" target="_blank" rel="noopener noreferrer"
            class="text-gray-300 hover:text-purple-400 transition-colors">
            Putnjiek
        </a>
    </span>
</footer>
