<section class="bg-gray-900 border border-gray-800 rounded-xl p-6 space-y-5">
    <div>
        <h2 class="text-xl font-semibold">Saved Skins</h2>
        <p class="text-sm text-gray-400 mt-1">
            Save skins in this browser and load them again later
        </p>
    </div>

    <div class="space-y-3">
        <input type="text" [value]="saveName()" (input)="saveName.set($any($event.target).value)"
            aria-label="Name for saved skin" placeholder="Skin name"
            class="w-full min-w-0 bg-gray-800 border border-gray-700 rounded-lg px-4 py-3" />

        <button (click)="saveSkin()" [disabled]="!saveName().trim()"
            class="w-full bg-purple-700 hover:bg-purple-600 active:bg-purple-800 disabled:opacity-50 disabled:cursor-not-allowed transition-colors rounded-lg px-6 py-3 font-medium">
            Save Skin
        </button>
    </div>

    <div>
        <label for="saved-skin-select" class="block text-sm text-gray-400 mb-2">
            Load a saved skin
        </label>
        <select id="saved-skin-select" [value]="selectedSkinName()"
            (change)="selectSavedSkin($any($event.target).value)"
            class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="">Choose a saved skin</option>
            @for (skin of savedSkins(); track skin.name) {
            <option [value]="skin.name">{{ skin.name }}</option>
            }
        </select>
            <button type="button" (click)="confirmDeleteSkin(selectedSkinName())"
                [disabled]="!selectedSkinName()"
                class="w-full mt-3 bg-red-800 hover:bg-red-700 active:bg-red-900 disabled:opacity-50 disabled:cursor-not-allowed transition-colors rounded-lg px-4 py-3 font-medium">
                Delete Selected Skin
            </button>
    </div>
    @if (errorMessage()) {
    <p class="text-sm text-red-400">{{ errorMessage() }}</p>
    }
</section>

<app-toast [(showToast)]="showSaveToast">
    <span class="text-green-400 text-lg">✓</span>
    <span class="text-sm font-medium">Skin saved locally!</span>
</app-toast>
